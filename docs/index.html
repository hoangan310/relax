<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goc Choi Cua Con</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <p class="eyebrow">GitHub Pages Game Hub</p>
        <h1>Goc choi nho xinh</h1>
        <p class="hero-copy">
          Chon mot tro choi de bat dau. Moi tro deu mo trong chinh website nay
          va co nut quay lai trang chu.
        </p>
      </section>

      <section aria-labelledby="games-title" class="games-section">
        <div class="section-heading">
          <h2 id="games-title">Danh sach tro choi</h2>
          <p>Bat dau voi game luyen tri nho 3x3.</p>
        </div>
        <div id="game-list" class="game-grid"></div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
